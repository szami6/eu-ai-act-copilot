[project]
name = "eu-ai-act-copilot"
version = "0.1.0"
description = "Agentic RAG compliance assistant for the EU AI Act, built with LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.6",
    "httpx>=0.27",
    "langgraph>=1.2.11",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()-as-default-arg is the idiomatic DI pattern, not the
# mutable-default-argument bug B008 is meant to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
# "." lets tests import `evals.run_eval` (PLAN.md §7.2's harness lives at
# repo root, alongside `src/`, not inside the `copilot` package).
pythonpath = ["src", "."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]
